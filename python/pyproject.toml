[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hs3-decode"
version = "0.1.0"
description = "Ford Fusion Hybrid (CD4) HS-CAN4 reverse-engineered decoders and byte map"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vitaliy Subbotskyy"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.scripts]
hs3-parse = "hs3_decode.parser:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hs3_decode*"]
