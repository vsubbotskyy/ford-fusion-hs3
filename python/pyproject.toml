[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ford-fusion-hs3-decode"
version = "0.2.0"
description = "Ford Fusion Hybrid (CD4) HS-CAN4 reverse-engineered decoders and byte map"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Vitaliy Subbotskyy"}
]
keywords = ["can", "ford", "automotive", "fusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.urls]
Homepage = "https://github.com/vsubbotskyy/ford-fusion-hs3"
Repository = "https://github.com/vsubbotskyy/ford-fusion-hs3"
Issues = "https://github.com/vsubbotskyy/ford-fusion-hs3/issues"

[project.scripts]
hs3-parse = "hs3_decode.parser:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hs3_decode*"]
